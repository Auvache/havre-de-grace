  <title id="a1-ghost-plate--sheet-title">Ghost Plate — music video style reference (a1-ghost-plate)</title>
  <desc id="a1-ghost-plate--sheet-desc">The film as it stands, with the slate stripped off and a drawing of what the line is about held behind the type at seven per cent. Frame is 1600x900; the strip below the frame is apparatus, not part of the film.</desc>
