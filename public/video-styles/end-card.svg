  <rect x="40" y="132" width="740" height="416" fill="none" stroke="#23232a" stroke-width="1"/>
  <text class="sheet-label" x="40" y="588" font-size="17" letter-spacing="3" fill="#c9a227">Screen one · logo</text>
  <text class="sheet-note" x="40" y="618" font-size="16" fill="#77746d">Lands on the last note. Held 3s. Nothing else in frame.</text>
  
  <g clip-path="url(#end-card--ec-clip-820)">
    <g transform="translate(820 132) scale(0.4625)">
  <rect x="0" y="0" width="1600" height="900" fill="#000000"/>
  <text x="800" y="430.6" font-size="34" font-weight="400" fill="#f4f6f7" text-anchor="middle">Words, voice and guitar — Stefan Auvache Bradley</text><text x="800" y="492.6" font-size="34" font-weight="400" fill="#f4f6f7" text-anchor="middle">Mellophone, mix and production — Parker Holt</text></g>
  </g>
  <rect x="820" y="132" width="740" height="416" fill="none" stroke="#23232a" stroke-width="1"/>
  <text class="sheet-label" x="820" y="588" font-size="17" letter-spacing="3" fill="#c9a227">Screen two · credits</text>
  <text class="sheet-note" x="820" y="618" font-size="16" fill="#77746d">Hard cut at +3s. One per line, centred every way.</text>

  <line x1="40" y1="688" x2="1560" y2="688" stroke="#23232a" stroke-width="1"/>
  <text class="sheet-note" x="40" y="724" font-size="16" fill="#77746d">Black #000000 · ink #F4F6F7 · lockup 500 units wide on a 1600 frame · credits 34 on 62 · no fades, no mark on screen two.</text>
</svg>
