<svg xmlns="http://www.w3.org/2000/svg" class="vs-sheet" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-labelledby="end-card--ec-title end-card--ec-desc">
  <title id="end-card--ec-title">The end card — every film, the same two screens</title>
  <desc id="end-card--ec-desc">The stacked lockup centred on black, held three seconds from the last note, then a hard cut to the credits on the same black, one per line, centred.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&amp;display=swap');
    svg.vs-sheet text { font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    svg.vs-sheet .sheet-label { font-weight: 600; text-transform: uppercase; }
    svg.vs-sheet .sheet-note { font-weight: 400; }
  </style>
  <defs>
    <clipPath id="end-card--ec-clip-40"><rect x="40" y="132" width="740" height="416"/></clipPath>
    <clipPath id="end-card--ec-clip-820"><rect x="820" y="132" width="740" height="416"/></clipPath>
  </defs>

  <rect width="1600" height="760" fill="#08080a"/>
  <text class="sheet-label" x="40" y="62" font-size="17" letter-spacing="3" fill="#e8e5de">THE END CARD — THE SAME IN ALL SEVEN</text>
  <text class="sheet-note" x="40" y="94" font-size="16" fill="#77746d">Splash-screen lockup, splash-screen ink, pure black ground. No style gets its own version of this.</text>

  
  <g clip-path="url(#end-card--ec-clip-40)">
    <g transform="translate(40 132) scale(0.4625)">
  <rect x="0" y="0" width="1600" height="900" fill="#000000"/>
