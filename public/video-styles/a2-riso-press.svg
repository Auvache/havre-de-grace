<svg xmlns="http://www.w3.org/2000/svg" class="vs-sheet" viewBox="0 0 1600 1260" width="1600" height="1260" role="img" aria-labelledby="a2-riso-press--sheet-title a2-riso-press--sheet-desc">
  <title id="a2-riso-press--sheet-title">Riso Press — music video style reference (a2-riso-press)</title>
  <desc id="a2-riso-press--sheet-desc">Two inks on uncoated paper with the plates a few pixels out of register. Grain everywhere, stamped motifs, one poster per line. Frame is 1600x900; the strip below the frame is apparatus, not part of the film.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&amp;display=swap');
    svg.vs-sheet text { font-family: "Jost", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    svg.vs-sheet .sheet-label { font-weight: 600; text-transform: uppercase; }
    svg.vs-sheet .sheet-note { font-weight: 400; }
  </style>
  <defs><clipPath id="a2-riso-press--thumb-0"><rect x="40" y="960" width="284" height="160"/></clipPath><clipPath id="a2-riso-press--thumb-1"><rect x="349" y="960" width="284" height="160"/></clipPath><clipPath id="a2-riso-press--thumb-2"><rect x="658" y="960" width="284" height="160"/></clipPath><clipPath id="a2-riso-press--thumb-3"><rect x="967" y="960" width="284" height="160"/></clipPath><clipPath id="a2-riso-press--thumb-4"><rect x="1276" y="960" width="284" height="160"/></clipPath><filter id="a2-riso-press--riso-grain" x="0" y="0" width="100%" height="100%">
