<svg xmlns="http://www.w3.org/2000/svg" class="vs-sheet" viewBox="0 0 1600 1260" width="1600" height="1260" role="img" aria-labelledby="a4-wide-margin--sheet-title a4-wide-margin--sheet-desc">
  <title id="a4-wide-margin--sheet-title">Wide Margin — music video style reference (a4-wide-margin)</title>
  <desc id="a4-wide-margin--sheet-desc">Swiss editorial. A narrow measure of quiet type at the left, one large line drawing at the right, and a great deal of paper left alone. Frame is 1600x900; the strip below the frame is apparatus, not part of the film.</desc>
