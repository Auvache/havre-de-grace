description: "Into the Wild represents the true beginning of Stefan's *Havre De Grace* project. The songs were selected, organized, and produced with the intention of being listened to as a whole body of work. The album explores what music means to the artist and the listener — adventure, creativity, self-identity, and a medium for working through big emotions."

