# Funding Directory — /resources/tools/funding
#
# Stefan: this file is the directory. Add an entry, change a tradeoff line, fix
# a deadline — the filters, the sort, the "closed" badges and the print view
# all read from here.
#
# Rules this file is kept to, and they matter more than the entry count:
#
#   * Every entry was checked against the organisation's OWN site. `sourceUrl`
#     is the page it was checked against; `url` is where an artist goes.
#   * `lastVerified` is per entry, not per file. Change a fact, change the date.
#   * `tradeoff` is the catch, in one honest sentence. Every entry has one,
#     including the good ones. If you can't name a catch, look harder.
#   * No affiliate links. No sponsored entries. Ever.
#   * `deadline` is 'rolling', an ISO date, or a sentence. A past ISO date is
#     computed at VIEW time, not build time — an entry that closed yesterday
#     shows as closed to a visitor today without a rebuild.
#   * `reopens` is the month a closed annual programme usually comes back. An
#     entry with a past deadline and no `reopens` is hidden rather than shown
#     as stale.
#
# Scope is US-first, and Pacific Northwest first within that, because that is
# where the ground truth is. Residency requirements are stated plainly — most
# of the local money is unusable from the wrong side of a county line.

lastVerified: '2026-09-21'

legend:
  - type: grant
    label: Grants
    blurb: Money you don't pay back, awarded on an application. Competitive, slow, and usually tied to a project and a report.
    articleAnchor: '#grants'
  - type: advance
    label: Advances
    blurb: Cash now against royalties later. You keep your masters, but the money is recouped from your own future income before you see any of it.
    articleAnchor: '#royalty-advances'
  - type: loan
    label: Loans
    blurb: Borrowed money with interest and a repayment schedule. For a cash-flow crisis, not for a recording budget.
    articleAnchor: '#loans-and-emergency-funds'
  - type: emergency
    label: Emergency funds
    blurb: Crisis assistance for working musicians — usually medical, housing or disaster. Not project funding, and they will ask for documentation.
    articleAnchor: '#loans-and-emergency-funds'
  - type: fan-funding
    label: Fan funding
    blurb: Your own audience, paying up front. You keep control of everything and give up nothing but a platform fee — if the audience is already there.
    articleAnchor: '#fan-funding'

entries:
  # --- Pacific Northwest ---------------------------------------------------
  - name: MusicOregon Echo Fund
    type: grant
    region: Portland, OR
    amount: $1,000–$5,000
    eligibility: >-
      Working musicians who physically reside within Portland city limits and
      earn money creating or delivering music. Not open to engineers, venues or
      event producers who don't make music themselves.
    deadline: '2026-09-08'
    reopens: August
    repay: false
    tradeoff: >-
      Funds creative, non-performance projects only — tours, concerts and living
      expenses are explicitly excluded, and past recipients sit out a cycle.
    url: https://www.musicoregon.org/echo-fund
    sourceUrl: https://www.musicoregon.org/echo-fund
    lastVerified: '2026-09-21'

  - name: RACC Portland Arts Project Grant
    type: grant
    region: Portland, OR
    amount: Varies — see current guidelines
    eligibility: >-
      Portland-based artists, supporting the making and sharing of artistic work.
      All disciplines.
    deadline: '2026-10-28'
    reopens: September
    repay: false
    tradeoff: >-
      Project-scoped and Portland-only, so it funds a specific piece of work on
      a stated timeline rather than your year.
    url: https://racc.org/grants/
    sourceUrl: https://racc.org/grants/
    lastVerified: '2026-09-21'
    verifyNote: >-
      Award size isn't stated on the grants index — check the programme page
      before applying.

  - name: RACC Professional Development Grants
    type: grant
    region: Portland, OR
    amount: Varies — a recent round awarded $116,000 across 74 artists
    eligibility: >-
      Artists and arts administrators, to offset the cost of a specific
      opportunity — a residency, a conference, a showcase, equipment for a
      defined purpose.
    deadline: See site — runs in cycles through the year
    reopens: Varies
    repay: false
    tradeoff: >-
      Tied to one named opportunity you can document, not general support, so
      you need the opportunity before you need the grant.
    url: https://racc.org/grants/
    sourceUrl: https://racc.org/grants/
    lastVerified: '2026-09-21'

  - name: Oregon Arts Commission — Career Opportunity Grant
    type: grant
    region: Oregon
    amount: Varies — see current guidelines
    eligibility: Oregon artists, all artistic disciplines including music.
    deadline: '2026-09-23'
    reopens: September
    repay: false
    tradeoff: >-
      For a concrete, time-limited career opportunity, and it is a state
      programme — an Oregon address is the first filter.
    url: https://www.oregon.gov/biz/aboutus/artscommission/grants/forindividualartists/Pages/default.aspx
    sourceUrl: https://www.oregon.gov/biz/aboutus/artscommission/Pages/default.aspx
    lastVerified: '2026-09-21'

  - name: Oregon Arts Commission — Individual Artist Fellowship
    type: grant
    region: Oregon
    amount: Varies — see current guidelines
    eligibility: Oregon artists, all artistic disciplines including music.
    deadline: '2026-10-14'
    reopens: October
    repay: false
    tradeoff: >-
      Merit-based on a body of existing work rather than a proposal, so it
      rewards a catalogue you have already built.
    url: https://www.oregon.gov/biz/aboutus/artscommission/grants/forindividualartists/Pages/default.aspx
    sourceUrl: https://www.oregon.gov/biz/aboutus/artscommission/Pages/default.aspx
    lastVerified: '2026-09-21'

  - name: Artist Trust — Grants for Artist Projects (GAP)
    type: grant
    region: Washington State
    amount: $2,500 (65 awards)
    eligibility: >-
      Practising artists resident in Washington State, all disciplines —
      literary, media, performing and visual. Musicians qualify.
    deadline: '2026-06-22'
    reopens: May
    repay: false
    tradeoff: >-
      Project funding at a real-world scale: $2,500 across 65 awards for an
      entire state's artists, so treat it as seed money and expect competition.
    url: https://artisttrust.org/grants/
    sourceUrl: https://artisttrust.org/grants/
    lastVerified: '2026-09-21'

  - name: Artist Trust — Fellowship Awards
    type: grant
    region: Washington State
    amount: $10,000 (15 awards)
    eligibility: >-
      Practising professional artists in Washington State, all disciplines.
      Unrestricted — no project required.
    deadline: '2026-11-02'
    reopens: October
    repay: false
    tradeoff: >-
      Unrestricted money is the rarest kind, so the odds are the catch: fifteen
      awards, statewide, judged on the work you have already made.
    url: https://artisttrust.org/grants/
    sourceUrl: https://artisttrust.org/grants/
    lastVerified: '2026-09-21'

  - name: Artist Trust — Arts Innovator Award
    type: grant
    region: Washington State
    amount: $25,000 (2 awards)
    eligibility: >-
      Washington State artists across all disciplines whose work demonstrates
      innovation.
    deadline: '2026-03-16'
    reopens: February
    repay: false
    tradeoff: >-
      Two awards a year for the whole state, and "innovative" is doing a lot of
      work in the criteria — read past recipients before you spend a weekend on
      the application.
    url: https://artisttrust.org/grants/
    sourceUrl: https://artisttrust.org/grants/
    lastVerified: '2026-09-21'

  # --- US national ---------------------------------------------------------
  - name: Foundation for Contemporary Arts — Emergency Grants
    type: grant
    region: US
    amount: $500–$3,000 (average around $2,200)
    eligibility: >-
      Visual and performing artists and poets living and working anywhere in
      the US. Projects outside the US are eligible if you are US-based.
    deadline: rolling
    repay: false
    tradeoff: >-
      Only covers a sudden, unanticipated opportunity or an unbudgeted cost on
      a nearly-finished project with a confirmed date — it is not general
      support, and a vague application fails on that alone.
    url: https://www.foundationforcontemporaryarts.org/grants/emergency-grants/
    sourceUrl: https://www.foundationforcontemporaryarts.org/grants/emergency-grants/
    lastVerified: '2026-09-21'

  - name: Creative Capital Award
    type: grant
    region: US
    amount: Up to $50,000
    eligibility: >-
      Artists proposing new work across all disciplines, performing arts and
      music included.
    deadline: See site — application windows vary by cycle
    reopens: Varies
    repay: false
    tradeoff: >-
      Built around an ambitious proposal for work that does not exist yet, and
      the field is thousands of applications deep.
    url: https://creative-capital.org/creative-capital-award/
    sourceUrl: https://creative-capital.org/creative-capital-award/
    lastVerified: '2026-09-21'
    verifyNote: >-
      The award page doesn't state the current application window — confirm
      dates before planning around it.

  - name: USArtists International (Mid Atlantic Arts)
    type: grant
    region: US — for travel abroad
    amount: Up to $11,000, with a one-to-one cost match
    eligibility: >-
      US-based performing artists and ensembles from any state or territory,
      all performing arts disciplines, invited to a festival, arts market or
      other eligible engagement outside the US.
    deadline: '2026-02-25'
    reopens: February
    repay: false
    tradeoff: >-
      You need the invitation first, and the one-to-one match means you are
      funding half of it yourself.
    url: https://midatlanticarts.org/grants-programs/usartists-international/
    sourceUrl: https://midatlanticarts.org/grants-programs/usartists-international/
    lastVerified: '2026-09-21'
    verifyNote: >-
      This programme has historically run more than one deadline a year;
      confirm the current round.

  # --- Emergency -----------------------------------------------------------
  - name: MusiCares
    type: emergency
    region: US & Puerto Rico
    amount: Varies by need — paid to your providers, not to you
    eligibility: >-
      Five years' employment in the music industry (non-consecutive and
      part-time both count), or credits on at least six commercially released
      recordings or videos.
    deadline: rolling
    repay: false
    tradeoff: >-
      Crisis assistance only, paid direct to the landlord or the utility rather
      than into your account, and the work-history bar rules out anyone early
      in a career.
    url: https://www.musicares.org/get-help
    sourceUrl: https://www.musicares.org/get-help
    lastVerified: '2026-09-21'

  - name: Sweet Relief Musicians Fund
    type: emergency
    region: US
    amount: Varies by need
    eligibility: >-
      Career musicians and music industry workers facing a serious medical or
      mental health condition, disability, or age-related hardship, earning at
      least 50% of their income from music. The medical requirement is waived
      for musicians 65 and over.
    deadline: rolling
    repay: false
    tradeoff: >-
      Needs documentation — a medical diagnosis or bills, tax returns or bank
      statements, and a lease or mortgage for housing help.
    url: https://www.sweetrelief.org/request-assistance.html
    sourceUrl: https://www.sweetrelief.org/request-assistance.html
    lastVerified: '2026-09-21'

  - name: Jazz Foundation of America — Musicians' Emergency Fund
    type: emergency
    region: US
    amount: Varies by need
    eligibility: >-
      Musicians who have made a living playing blues, jazz and roots music.
      Covers housing, utilities, pro bono medical and legal help, and disaster
      relief.
    deadline: rolling
    repay: false
    tradeoff: >-
      Genre-scoped by design — it exists for the blues, jazz and roots
      community, and applies that as a real filter.
    url: https://jazzfoundation.org/
    sourceUrl: https://jazzfoundation.org/musicians-emergency-fund/
    lastVerified: '2026-09-21'

  # --- Advances ------------------------------------------------------------
  - name: beatBread
    type: advance
    region: US & International
    amount: $1,000 to $10 million and up
    eligibility: >-
      Artists with existing streaming income. You pick the recoupment rate,
      the estimated deal length, how much income flows through to you meanwhile,
      and whether new music is included.
    deadline: rolling
    repay: true
    tradeoff: >-
      Recouped out of your own future royalties — a bigger cheque means a
      larger share of your income withheld for longer, and the deal length is
      an estimate that moves if streams fall.
    url: https://www.beatbread.com/
    sourceUrl: https://www.beatbread.com/
    lastVerified: '2026-09-21'

  - name: Amuse Fast Forward
    type: advance
    region: International
    amount: From around $10 up to tens of thousands
    eligibility: >-
      Amuse-distributed artists, with the offer calculated automatically from
      your streaming data — up to roughly six months of royalties up front.
    deadline: rolling
    repay: true
    tradeoff: >-
      Your distribution rights are locked until the advance and its fee are
      recouped, so you cannot move the catalogue elsewhere in the middle of it.
    url: https://www.amuse.io/en/fast-forward/
    sourceUrl: https://www.amuse.io/en/fast-forward/
    lastVerified: '2026-09-21'

  - name: Duetti
    type: advance
    region: US & International
    amount: Varies — negotiated per catalogue
    eligibility: >-
      Independent artists with an earning catalogue. You choose how much of it
      to include; payment lands within about 30 days.
    deadline: rolling
    repay: false
    tradeoff: >-
      This is a sale, not an advance — there is no recoupment because you are
      not getting the songs back. Whatever you sell stops being yours, however
      well it does later.
    url: https://duetti.co/
    sourceUrl: https://duetti.co/
    lastVerified: '2026-09-21'

  # --- Fan funding ---------------------------------------------------------
  - name: Kickstarter
    type: fan-funding
    region: International
    amount: Whatever you can raise — you set the goal
    eligibility: >-
      Anyone with a project, a deadline and a set of rewards. Funding is
      all-or-nothing.
    deadline: rolling
    repay: false
    tradeoff: >-
      Miss the goal and you get nothing at all; hit it and you owe 5% to
      Kickstarter plus 3% + $0.30 per pledge in processing — and every backer
      their reward, on time, at your own cost.
    url: https://www.kickstarter.com/help/fees?country=US
    sourceUrl: https://www.kickstarter.com/help/fees?country=US
    lastVerified: '2026-09-21'

  - name: Patreon
    type: fan-funding
    region: International
    amount: Recurring, at the price you set
    eligibility: Anyone with an audience willing to pay monthly.
    deadline: rolling
    repay: false
    tradeoff: >-
      10% of what you earn, plus payment processing, currency conversion and
      payout fees — and it only holds up if you keep delivering something every
      month, which is a second job on top of the first two.
    url: https://www.patreon.com/pricing
    sourceUrl: https://www.patreon.com/pricing
    lastVerified: '2026-09-21'

  - name: Bandcamp
    type: fan-funding
    region: International
    amount: Direct sales and subscriptions, priced by you
    eligibility: Anyone with music to sell.
    deadline: rolling
    repay: false
    tradeoff: >-
      15% on digital (dropping to 10% once you have passed $5,000 in sales in
      the last 12 months) and 10% on physical, plus payment processing of
      roughly 4–6% — and none of it moves without an audience that already
      knows where to find you.
    url: https://get.bandcamp.help/en/articles/15263193-what-are-bandcamp-s-fees
    sourceUrl: https://get.bandcamp.help/en/articles/15263193-what-are-bandcamp-s-fees
    lastVerified: '2026-09-21'
