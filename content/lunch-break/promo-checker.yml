# Promo & Playlist Scam Checker — /resources/tools/promo-checker
#
# Stefan: questions, weights, thresholds and the "what to do next" steps all
# live here. The component does the arithmetic and nothing else.
#
# Design rules, and they are deliberate:
#
#   * No company is ever named as a scam. Every question describes a PATTERN.
#     A pattern is checkable by the reader; an accusation is a liability and
#     goes stale the moment somebody changes their name.
#   * Nothing is sent anywhere. The answers never leave the browser, and the
#     tool calls no API.
#   * `decisive: true` means a single yes is enough for a High reading on its
#     own, whatever else was answered. Reserve it for things that are already
#     against a DSP's own rules.
#   * `weight` is relative, and the score is the share of the mode's total
#     weight that got flagged — so adding a question does not silently
#     re-scale every other one.
#   * "Unsure" counts half, because not knowing is itself information about an
#     offer. Set `unsureCounts: false` on a question where it genuinely is not
#     — there are none today.
#
# The result is a heuristic and the page says so in as many words. It is a
# prompt to look harder, not a verdict on anybody's business.

lastVerified: '2026-09-21'

# Share of the mode's available weight, 0–1.
thresholds:
  caution: 0.12
  high: 0.3

modes:
  - id: offer
    label: I'm considering a promo service
    blurb: >-
      Someone has offered to promote your music — by email, a DM, an ad, or a
      submission platform. Answer for the offer in front of you.
    questions:
      - id: guarantees-numbers
        question: Does it guarantee a number of streams, followers or playlist placements?
        flagOn: 'yes'
        weight: 5
        decisive: true
        why: >-
          Spotify's own guidance says third-party services advertising streams
          in return for payment violate its terms, and that using them can get
          your music removed. Nobody can guarantee a real listener.

      - id: charges-for-editorial
        question: Does it charge you to pitch to Spotify's editorial playlists?
        flagOn: 'yes'
        weight: 5
        decisive: true
        why: >-
          Pitching an unreleased song to Spotify's editors is a free feature of
          Spotify for Artists. Anyone charging for it is selling you something
          you already have.

      - id: asks-for-account-access
        question: Does it ask for your Spotify for Artists, distributor or streaming account login?
        flagOn: 'yes'
        weight: 5
        decisive: true
        why: >-
          A promotion service has no reason to hold your credentials. Account
          access is how a catalogue gets moved, redirected or taken over.

      - id: curators-identifiable
        question: Can you identify the actual curators — real names, real profiles you can look up?
        flagOn: 'no'
        weight: 3
        why: >-
          A curator who does this for a living has a name and a history. Anonymity
          is what makes a network of fake playlists reusable after it gets caught.

      - id: names-playlists
        question: Will it name the specific playlists in advance, before you pay?
        flagOn: 'no'
        weight: 3
        why: >-
          Refusing to say where your song is going means you cannot check the
          playlists for the warning signs in the other mode of this tool.

      - id: priced-per-stream
        question: Is the price tied to a number of streams, plays or followers?
        flagOn: 'yes'
        weight: 4
        why: >-
          Pricing by outcome only makes sense if the outcome can be manufactured.
          Real promotion is priced by the work, not by the counter.

      - id: unclear-deliverable
        question: Is it clear exactly what you are buying — a listen, a written review, a submission — rather than a result?
        flagOn: 'no'
        weight: 3
        why: >-
          Paying a curator for their time to listen and respond is a normal
          transaction. Paying for a placement is not, and vague wording is
          usually the second thing dressed as the first.

      - id: urgency
        question: Is there time pressure — a countdown, "only a few slots left", a price that expires today?
        flagOn: 'yes'
        weight: 2
        why: >-
          Manufactured urgency exists to stop you doing the ten minutes of
          checking you are doing right now.

      - id: no-track-record
        question: Can you find any independent trace of them — artists who will vouch, coverage, a history older than a few months?
        flagOn: 'no'
        weight: 3
        why: >-
          Testimonials on their own site cost nothing to write. An operation with
          no history outside its own marketing has usually had a previous name.

  - id: playlist
    label: A playlist added me and something feels off
    blurb: >-
      Your song turned up on a playlist you did not pitch, or your numbers moved
      in a way you cannot explain. Answer for that playlist.
    questions:
      - id: paid-for-placement
        question: Did you, or anyone working for you, pay for this placement?
        flagOn: 'yes'
        weight: 5
        decisive: true
        why: >-
          Paid placement on a user playlist is the thing the DSPs act on, and it
          is treated as your responsibility even when a third party did it.

      - id: approached-after
        question: Did the curator contact you afterwards offering paid promotion?
        flagOn: 'yes'
        weight: 5
        decisive: true
        why: >-
          Adding a track for free and then selling you more of it is a sales
          funnel, and the free placement is the demonstration.

      - id: followers-vs-engagement
        question: Does the playlist have a large follower count but almost no saves, likes or comments?
        flagOn: 'yes'
        weight: 4
        why: >-
          Followers are cheap to fabricate; engagement is not. A gap between the
          two is the clearest signal a playlist has on its face.

      - id: spike-one-place
        question: Did your streams spike from a single country or city you have no audience in?
        flagOn: 'yes'
        weight: 4
        why: >-
          Spotify tells artists to report exactly this — an unexplained spike from
          a new location — to their label or distributor.

      - id: unrelated-tracks
        question: Are the other tracks unrelated in genre, or mostly by artists with no presence anywhere else?
        flagOn: 'yes'
        weight: 3
        why: >-
          A real playlist has a taste running through it. A bot playlist is a
          container, and its contents are whoever paid this week.

      - id: no-curator
        question: Is there an identifiable curator — a name, a profile, a way to reach them?
        flagOn: 'no'
        weight: 3
        why: >-
          You need someone to ask for a removal. A playlist with no owner is a
          playlist you cannot get off.

      - id: listeners-vs-saves
        question: Are your listener numbers far out of proportion to saves and follows from the same period?
        flagOn: 'yes'
        weight: 3
        why: >-
          Real listening leaves a trail — saves, follows, repeat plays. Streams
          with none of that behind them are the pattern detection systems look for.

nextSteps:
  - level: low
    steps:
      - Nothing here looks like the usual pattern, but keep the evidence anyway — screenshot the playlist, the follower count and your stats page, and note the date.
      - If you are still paying someone, ask them in writing to name the playlists and the curators before any money moves.
      - Check your own numbers weekly for a few weeks. A spike is easier to explain the day it happens than a month later.

  - level: caution
    steps:
      - Document everything now — screenshots of the playlist, its follower count, your daily stats, and any messages from whoever approached you.
      - Ask directly for the things that were vague: which playlists, which curators, what exactly the money buys. A straight answer costs them nothing.
      - Do not pay anything further until you have those answers in writing.
      - If a playlist is involved, find the curator and ask to be removed. Keep the request and the reply.

  - level: high
    steps:
      - Stop. Do not pay, and do not hand over any account access.
      - Document everything before it disappears — screenshots of the playlist, the follower count, your daily stats, the full message thread, and any receipts.
      - Contact your distributor with what you have, and say plainly what you did and did not pay for. They are the ones who hear from the DSPs first, and getting ahead of it is the difference between a conversation and a takedown.
      - Report the playlist to Spotify, and ask the curator to remove the track if you can find one.
      - Do not buy a "protection", "cleanup" or "stream removal" service in response. There is no such product, and the people selling it found you the same way the first lot did.
